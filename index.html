<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#006b6b">
<title>AdminClientes V2.5</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:system-ui;background:#f4f7f7;color:#173232}
.app{max-width:620px;margin:auto;padding-bottom:82px}
header{background:#006b6b;color:white;padding:16px;font-size:21px;font-weight:800}
main{padding:14px}
.card{background:white;border:1px solid #dfe8e8;border-radius:15px;padding:14px;margin:10px 0}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 12px;border:1px solid #cbd8d8;border-radius:10px}
button{padding:11px 14px;border-radius:10px;border:0;font-weight:700}
.primary{background:#008f7a;color:white}.outline{background:white;color:#006b6b;border:1px solid #006b6b}
.danger{background:#ffe9e9;color:#b4232a}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1}
.avatar{width:55px;height:55px;border-radius:50%;object-fit:cover;background:#dce6e6;display:grid;place-items:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px;z-index:1000}
.nav button{background:white;color:#006b6b}
.login{min-height:100vh;display:grid;place-items:center;background:#006b6b}
.login .card{width:min(400px,85%);text-align:center}
.filebtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:48px}
.filebtn input{position:absolute;inset:0;opacity:.01;margin:0;cursor:pointer}
.photo{max-width:150px;max-height:150px;border-radius:14px;display:block;margin:8px auto}
small{color:#687777}.error{background:#ffe9e9;color:#9b1c1c;padding:10px;border-radius:10px;margin:10px 0}
#map{height:330px;border-radius:12px;margin:8px 0 12px}
.mapnote{font-size:13px;color:#687777}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:white;border:1px solid #dfe8e8;border-radius:14px;padding:13px}
.stat b{display:block;font-size:22px;margin-top:4px}.stat small{font-size:12px}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.sectiontitle h3{margin:0}.alert{border-left:4px solid #d97706}
.dangerbox{border-left:4px solid #b4232a}.greenbox{border-left:4px solid #008f7a}
.payment{border-left:4px solid #008f7a;padding-left:10px;margin:10px 0}
.collection-item{border-left:4px solid #006b6b}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#e6f3f1;color:#006b6b}
.badge-danger{background:#ffe9e9;color:#b4232a}.badge-today{background:#fff3d6;color:#9a5b00}.badge-paid{background:#e6f7ed;color:#18794e}.badge-partial{background:#fff3d6;color:#9a5b00}.balance{font-size:18px;font-weight:800}.statusline{margin:8px 0}
.total{font-size:25px;font-weight:800;margin-top:5px}
.print-only{display:none}
@media print{body{background:white}.nav,button,.no-print{display:none!important}.app{max-width:none;padding:0}.print-only{display:block}.card{border:1px solid #bbb;break-inside:avoid}}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.map-all{height:460px;border-radius:12px;margin:8px 0}
.chip{display:inline-block;padding:6px 9px;border-radius:999px;background:#eef4f4;margin:3px;font-size:12px}
.linkbtn{background:none;border:0;color:#006b6b;padding:0;font-weight:700}
.report-table{width:100%;border-collapse:collapse;font-size:13px}.report-table th,.report-table td{border-bottom:1px solid #ddd;padding:8px 4px;text-align:left}

.agenda-card{border-left:4px solid #006b6b}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exportbox{border-left:4px solid #6b7280}
.route-note{font-size:13px;color:#687777}

.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal-head{font-size:11px;text-align:center;color:#687777;font-weight:700;padding:4px}
.cal-day{background:white;border:1px solid #dfe8e8;border-radius:9px;min-height:62px;padding:6px;font-size:12px;cursor:pointer}
.cal-day b{display:block;font-size:14px}.cal-empty{visibility:hidden}.cal-today{outline:2px solid #008f7a}
.cal-due{background:#fff4df}.cal-overdue{background:#ffe9e9}.wa{background:#128c7e;color:white}
.receiptno{font-size:12px;color:#687777}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const SUPABASE_URL='https://dwijfgznbzhuhrdrwdri.supabase.co';
const SUPABASE_KEY='sb_publishable_aD4TGdGO5zxuPL8wld_PMQ_EWFuvA9Z';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BUCKET='Fotos-clientes';

let session=null,clients=[],payments=[],page='login',selected=null,photoFile=null;
let bootError='',selectedLat=null,selectedLng=null,map=null,mapMarker=null,allMap=null,allMapMarkers=[];
let clientFilterStatus='todos',clientFilterDue='todos';

document.addEventListener('DOMContentLoaded',()=>{
 render();
 start().catch(e=>{
  bootError=e?.message||String(e);page='error';render();
 });
});

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n)||0);
const date=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'—';
const localToday=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};

function addPeriod(dateStr,freq){
 const d=new Date(String(dateStr)+'T12:00:00');
 if(freq==='Semanal')d.setDate(d.getDate()+7);
 else if(freq==='Quincenal')d.setDate(d.getDate()+15);
 else d.setMonth(d.getMonth()+1);
 return d.toISOString().slice(0,10);
}
function subPeriod(dateStr,freq){
 const d=new Date(String(dateStr)+'T12:00:00');
 if(freq==='Semanal')d.setDate(d.getDate()-7);
 else if(freq==='Quincenal')d.setDate(d.getDate()-15);
 else d.setMonth(d.getMonth()-1);
 return d.toISOString().slice(0,10);
}
function obligationInfo(c){
 const today=localToday();
 if(!c?.proximo_pago)return {status:'sinfecha',label:'SIN FECHA',cls:'',paid:0,balance:0,due:null};
 const due=String(c.proximo_pago).slice(0,10);
 const start=subPeriod(due,c.frecuencia_pago||'Mensual');
 const paid=payments.filter(p=>p.cliente_id===c.id && String(p.fecha_pago).slice(0,10)>start && String(p.fecha_pago).slice(0,10)<=today)
   .reduce((s,p)=>s+(Number(p.cantidad)||0),0);
 const amount=Number(c.cantidad_pago)||0;
 const balance=Math.max(0,amount-paid);
 if(paid>=amount && amount>0)return {status:'paid',label:'PAGADO',cls:'badge-paid',paid,balance:0,due};
 if(paid>0)return {status:'partial',label:'ABONO',cls:'badge-partial',paid,balance,due};
 if(due<today)return {status:'overdue',label:'VENCIDO',cls:'badge-danger',paid:0,balance,due};
 if(due===today)return {status:'today',label:'HOY',cls:'badge-today',paid:0,balance,due};
 return {status:'upcoming',label:'PRÓXIMO',cls:'',paid:0,balance,due};
}
function statusBadge(c){const o=obligationInfo(c);return `<span class="badge ${o.cls}">${o.label}</span>`}
const $=id=>document.getElementById(id);
const message=t=>alert(t);

async function load(){
 if(!session)return;
 const a=await db.from('clientes').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false});
 const b=await db.from('pagos').select('*').eq('user_id',session.user.id).order('fecha_pago',{ascending:false});
 if(a.error)throw a.error;if(b.error)throw b.error;
 clients=a.data||[];payments=b.data||[];
}

async function signed(path){
 if(!path)return '';
 const r=await db.storage.from(BUCKET).createSignedUrl(path,3600);
 return r.data?.signedUrl||'';
}

async function start(){
 if(!window.supabase)throw new Error('No se pudo cargar la librería de Supabase.');
 const r=await db.auth.getSession();
 if(r.error)throw r.error;
 session=r.data.session;
 if(session){
  try{await load();page='dashboard';render();}
  catch(e){bootError=e?.message||String(e);page='error';render();}
 }
 db.auth.onAuthStateChange(async(_e,s)=>{
  session=s;
  if(!s){page='login';render();}
  else{
   try{await load();page='dashboard';render();}
   catch(e){bootError=e?.message||String(e);page='error';render();}
  }
 });
}

function render(){
 if(page==='login'){
  $('root').innerHTML=`<div class="login"><div class="card">
  <h1>👥 AdminClientes</h1><p>Inicia sesión para sincronizar tus clientes.</p>
  <label>Correo</label><input id="email" type="email">
  <label>Contraseña</label><input id="pass" type="password">
  <button class="primary" style="width:100%" onclick="login()">Iniciar sesión</button>
  </div></div>`;return;
 }
 if(page==='error'){
  $('root').innerHTML=`<div class="app"><header>AdminClientes</header><main>
  <div class="error"><b>Error al cargar:</b><br>${esc(bootError||'Error desconocido')}</div>
  <button class="outline" onclick="location.reload()">Reintentar</button></main></div>`;return;
 }
 let body=page==='dashboard'?dashboard():
  page==='clients'?list():
  page==='form'?form():
  page==='detail'?detail():
  page==='payments'?payForm():
  page==='collection'?collection():
  page==='map'?mapAllPage():
  page==='reports'?reports():
  page==='security'?securityPage():
  page==='agenda'?agenda():
  page==='backup'?backupPage():
  page==='calendar'?calendarPage():
  history();
 $('root').innerHTML=`<div class="app"><header>AdminClientes</header><main>${body}</main>
 <div class="nav">
 <button onclick="page='dashboard';render()">🏠 Inicio</button>
 <button onclick="page='clients';render()">👥 Clientes</button>
 <button onclick="page='collection';render()">💰 Cobranza</button>
 <button onclick="page='map';render()">🗺️ Mapa</button>
 <button onclick="moreMenu()">☰ Más</button>
 </div></div>`;
 if(page==='clients')loadPhotos();
 if(page==='detail')loadDetailPhoto();
 if(page==='form')setTimeout(initMap,100);
 if(page==='map')setTimeout(initAllMap,100);
}

async function login(){
 const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});
 if(r.error)return message(r.error.message);
 session=r.data.session;await load();page='dashboard';render();
}
async function logout(){await db.auth.signOut();session=null;page='login';render()}
function newClient(){selected=null;photoFile=null;selectedLat=null;selectedLng=null;page='form';render()}
function editClient(){
 const c=clients.find(x=>x.id===selected);
 selectedLat=c?.latitud??null;selectedLng=c?.longitud??null;photoFile=null;page='form';render();
}
function openClient(id){selected=id;page='detail';render()}

function dashboard(){
 const today=localToday(),month=today.slice(0,7);
 const paidToday=payments.filter(p=>String(p.fecha_pago).slice(0,10)===today).reduce((s,p)=>s+(Number(p.cantidad)||0),0);
 const paidMonth=payments.filter(p=>String(p.fecha_pago).slice(0,7)===month).reduce((s,p)=>s+(Number(p.cantidad)||0),0);
 const overdue=clients.filter(c=>c.proximo_pago&&String(c.proximo_pago).slice(0,10)<today);
 const dueToday=clients.filter(c=>c.proximo_pago&&String(c.proximo_pago).slice(0,10)===today);
 const upcoming=clients.filter(c=>c.proximo_pago&&String(c.proximo_pago).slice(0,10)>today)
  .sort((a,b)=>String(a.proximo_pago).localeCompare(String(b.proximo_pago))).slice(0,5);
 return `<h2>🏠 Resumen</h2>
 <div class="stats">
 <div class="stat">👥<small>Clientes</small><b>${clients.length}</b></div>
 <div class="stat">💵<small>Cobrado hoy</small><b>${money(paidToday)}</b></div>
 <div class="stat">📆<small>Cobrado este mes</small><b>${money(paidMonth)}</b></div>
 <div class="stat">🔴<small>Pagos vencidos</small><b>${overdue.length}</b></div></div>
 <div class="sectiontitle"><h3>⚠️ Atención</h3></div>
 ${overdue.length?`<div class="card dangerbox"><b>${overdue.length} cliente(s) con pago vencido</b>
 ${overdue.slice(0,5).map(c=>`<p><button class="outline" onclick="openClient('${c.id}')">${esc(c.nombre)} · ${date(c.proximo_pago)}</button></p>`).join('')}
 ${overdue.length>5?'<small>Se muestran los primeros 5.</small>':''}</div>`:
 `<div class="card greenbox">✅ No hay pagos vencidos.</div>`}
 ${dueToday.length?`<div class="card alert"><b>🟠 ${dueToday.length} pago(s) vencen hoy</b>
 ${dueToday.map(c=>`<p><button class="outline" onclick="openClient('${c.id}')">${esc(c.nombre)} · ${money(c.cantidad_pago)}</button></p>`).join('')}</div>`:''}
 <div class="sectiontitle"><h3>📅 Próximos pagos</h3><button class="outline" onclick="page='collection';render()">Ver cobranza</button></div>
 ${upcoming.length?upcoming.map(c=>`<div class="card" onclick="openClient('${c.id}')"><b>${esc(c.nombre)}</b><br>📅 ${date(c.proximo_pago)} · ${money(c.cantidad_pago)}</div>`).join(''):
 '<div class="card">No hay próximos pagos registrados.</div>'}
 <div class="actions"><button class="primary" onclick="newClient()">＋ Nuevo cliente</button>
 <button class="outline" onclick="page='collection';render()">💰 Cobranza</button></div>
 <div class="actions" style="margin-top:8px"><button class="outline" onclick="page='map';render()">🗺️ Mapa general</button><button class="outline" onclick="page='reports';render()">📄 Reportes</button></div>
 <div class="actions" style="margin-top:8px"><button class="outline" onclick="page='security';render()">🔐 Seguridad</button><button class="outline" onclick="printDailyTicket()">🧾 Ticket/resumen</button></div>
 <div class="actions" style="margin-top:8px"><button class="outline" onclick="page='agenda';render()">🗓️ Agenda</button><button class="outline" onclick="page='calendar';render()">📆 Calendario</button></div>
 <div class="actions" style="margin-top:8px"><button class="outline" onclick="page='backup';render()">💾 Respaldo</button><button class="outline" onclick="printMonthlyReport()">📈 Reporte mensual</button></div>`;
}

function list(){
 if(!clients.length)return `<h2>Clientes</h2><div class="card" style="text-align:center">No hay clientes registrados.</div><button class="primary" onclick="newClient()">＋ Agregar cliente</button>`;
 return `<h2>Clientes</h2>
 <label>🔎 Buscar</label><input id="clientSearch" placeholder="Nombre, cuenta o teléfono..." oninput="filterClientsAdvanced()">
 <div class="toolbar">
  <select id="clientStatus" onchange="filterClientsAdvanced()"><option value="todos">Todos</option><option value="ubicados">Con ubicación</option><option value="sinubicacion">Sin ubicación</option></select>
  <select id="clientDue" onchange="filterClientsAdvanced()"><option value="todos">Todos los pagos</option><option value="vencidos">Vencidos</option><option value="hoy">Vencen hoy</option><option value="proximos">Próximos</option><option value="sinfecha">Sin fecha</option></select>
 </div>
 <div class="card"><b>Filtros avanzados</b><div id="clientCount" class="mapnote"></div></div>
 <div id="list">${cards(clients)}</div>`;
}
function filterClientsAdvanced(){
 const q=($('clientSearch')?.value||'').toLowerCase().trim(), st=$('clientStatus')?.value||'todos', due=$('clientDue')?.value||'todos', today=localToday();
 const arr=clients.filter(c=>{
  const text=(c.nombre+' '+c.numero_cuenta+' '+(c.telefono||'')).toLowerCase();
  if(q&&!text.includes(q))return false;
  const hasLoc=c.latitud!=null&&c.longitud!=null;
  if(st==='ubicados'&&!hasLoc)return false;if(st==='sinubicacion'&&hasLoc)return false;
  const d=c.proximo_pago?String(c.proximo_pago).slice(0,10):'';
  if(due==='vencidos'&&!(d&&d<today))return false;if(due==='hoy'&&d!==today)return false;if(due==='proximos'&&!(d&&d>today))return false;if(due==='sinfecha'&&d)return false;
  return true;
 });
 $('list').innerHTML=cards(arr);$('clientCount').textContent=`Mostrando ${arr.length} de ${clients.length} cliente(s).`;loadPhotos();
}
function cards(arr){
 return arr.map(c=>`<div class="card" onclick="openClient('${c.id}')"><div class="row">
 <div id="p-${c.id}" class="avatar">👤</div><div class="grow"><b>${esc(c.nombre)}</b><br>
 <small>Cuenta #${esc(c.numero_cuenta)}</small><br>${money(c.cantidad_pago)} · Próx. ${date(c.proximo_pago)}<br>${statusBadge(c)} ${obligationInfo(c).paid?`<small>Pagado: ${money(obligationInfo(c).paid)} · Saldo: ${money(obligationInfo(c).balance)}</small>`:''}
 ${c.latitud!=null&&c.longitud!=null?'<br>📍 Ubicación guardada':''}</div></div></div>`).join('');
}
function filter(q){
 $('list').innerHTML=cards(clients.filter(c=>(c.nombre+' '+c.numero_cuenta+' '+(c.telefono||'')).toLowerCase().includes(q.toLowerCase())));loadPhotos();
}
async function loadPhotos(){
 for(const c of clients){if(!c.foto_url)continue;const u=await signed(c.foto_url);const e=$('p-'+c.id);if(e&&u)e.innerHTML=`<img class="avatar" src="${u}">`}
}
async function loadDetailPhoto(){
 const c=clients.find(x=>x.id===selected);if(!c?.foto_url)return;
 const u=await signed(c.foto_url);const e=$('detailPhoto');if(e&&u)e.src=u;
}

function form(){
 const c=clients.find(x=>x.id===selected)||{};
 selectedLat=c.latitud??null;selectedLng=c.longitud??null;
 return `<button class="outline" onclick="page='clients';render()">← Clientes</button><h2>${selected?'Editar':'Nuevo'} cliente</h2>
 <label>Número de cuenta *</label><input id="account" value="${esc(c.numero_cuenta)}">
 <label>Nombre *</label><input id="name" value="${esc(c.nombre)}">
 <label>Contacto</label><input id="phone" type="tel" value="${esc(c.telefono)}">
 <label>Cantidad de pago *</label><input id="amount" type="number" step="0.01" value="${c.cantidad_pago??''}">
 <label>Frecuencia</label><select id="freq">
 <option ${c.frecuencia_pago==='Semanal'?'selected':''}>Semanal</option>
 <option ${c.frecuencia_pago==='Quincenal'?'selected':''}>Quincenal</option>
 <option ${!c.frecuencia_pago||c.frecuencia_pago==='Mensual'?'selected':''}>Mensual</option></select>
 <label>Próximo pago</label><input id="next" type="date" value="${String(c.proximo_pago||'').slice(0,10)}">
 <div class="card"><b>📍 Ubicación del cliente</b><div class="mapnote">Obtén GPS o toca el mapa. El marcador se puede arrastrar.</div>
 <div class="actions"><button class="primary" onclick="getGPS()">📍 Obtener GPS</button><button class="outline" onclick="clearLocation()">🗑️ Quitar</button></div>
 <div id="map"></div><div id="coords" class="mapnote">Sin ubicación seleccionada.</div></div>
 <div class="card"><b>Fotografía</b><div class="actions">
 <label class="primary filebtn">📷 Tomar foto<input id="cam" type="file" accept="image/*" capture="environment" onchange="pickPhoto(this)"></label>
 <label class="outline filebtn">🖼️ Galería<input id="gal" type="file" accept="image/*" onchange="pickPhoto(this)"></label></div>
 <div id="preview">${c.foto_url?'<small>Fotografía actual guardada.</small>':''}</div></div>
 <label>Notas</label><textarea id="notes">${esc(c.notas)}</textarea>
 <div class="actions"><button class="primary" onclick="saveClient()">💾 Guardar</button><button class="outline" onclick="page='clients';render()">Cancelar</button></div>`;
}

function initMap(){
 if(!window.L)return;const el=$('map');if(!el)return;
 const lat=Number(selectedLat),lng=Number(selectedLng),has=Number.isFinite(lat)&&Number.isFinite(lng);
 map=L.map('map').setView(has?[lat,lng]:[19.4326,-99.1332],has?16:5);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 if(has)setMarker(lat,lng,false);
 map.on('click',e=>setMarker(e.latlng.lat,e.latlng.lng,true));updateCoords();
}
function setMarker(lat,lng,move=true){
 selectedLat=Number(lat);selectedLng=Number(lng);if(!map)return;
 if(mapMarker)mapMarker.setLatLng([selectedLat,selectedLng]);
 else mapMarker=L.marker([selectedLat,selectedLng],{draggable:true}).addTo(map);
 mapMarker.off('dragend').on('dragend',()=>{const p=mapMarker.getLatLng();selectedLat=p.lat;selectedLng=p.lng;updateCoords()});
 if(move)map.setView([selectedLat,selectedLng],17);updateCoords();
}
function updateCoords(){
 const e=$('coords');if(!e)return;
 e.innerHTML=selectedLat!=null&&selectedLng!=null?`📍 Ubicación seleccionada<br>Latitud: ${Number(selectedLat).toFixed(6)} · Longitud: ${Number(selectedLng).toFixed(6)}`:'Sin ubicación seleccionada.';
}
function getGPS(){
 if(!navigator.geolocation)return message('Este dispositivo no permite obtener GPS desde el navegador.');
 navigator.geolocation.getCurrentPosition(pos=>setMarker(pos.coords.latitude,pos.coords.longitude,true),
 err=>message(({1:'Permiso de ubicación denegado. Activa la ubicación para el navegador.',2:'No se pudo obtener la ubicación. Intenta nuevamente.',3:'La solicitud de ubicación tardó demasiado. Intenta nuevamente.'}[err.code]||'No se pudo obtener la ubicación.')),
 {enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function clearLocation(){
 selectedLat=null;selectedLng=null;
 if(mapMarker&&map){map.removeLayer(mapMarker);mapMarker=null}updateCoords();
}
function pickPhoto(i){

async function saveClient(){
 const p={user_id:session.user.id,numero_cuenta:$('account').value.trim(),nombre:$('name').value.trim(),telefono:$('phone').value.trim(),
 cantidad_pago:Number($('amount').value),frecuencia_pago:$('freq').value,proximo_pago:$('next').value||null,
 latitud:selectedLat,longitud:selectedLng,notas:$('notes').value};
 if(!p.numero_cuenta||!p.nombre||!Number.isFinite(p.cantidad_pago))return message('Completa cuenta, nombre y cantidad.');
 let r=selected?await db.from('clientes').update(p).eq('id',selected).eq('user_id',session.user.id).select().single():
 await db.from('clientes').insert(p).select().single();
 if(r.error)return message(r.error.message);
 const id=r.data.id;
 if(photoFile){
  const ext=(photoFile.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'')||'jpg';
  const path=`${session.user.id}/${id}/${crypto.randomUUID()}.${ext}`;
  const u=await db.storage.from(BUCKET).upload(path,photoFile,{contentType:photoFile.type||'image/jpeg',upsert:false});
  if(u.error)return message('Cliente guardado, pero foto: '+u.error.message);
  const x=await db.from('clientes').update({foto_url:path}).eq('id',id).eq('user_id',session.user.id);
  if(x.error)return message(x.error.message);
 }
 await load();selected=id;photoFile=null;page='detail';render();message('Cliente guardado correctamente en Supabase.');
}

function mapAllPage(){return `<h2>🗺️ Mapa de clientes</h2><div class="card"><b>${clients.filter(c=>c.latitud!=null&&c.longitud!=null).length}</b> cliente(s) con ubicación guardada.<br><small>Toca un marcador para abrir la ficha.</small></div><div id="allMap" class="map-all"></div><div class="actions"><button class="outline" onclick="page='clients';render()">👥 Clientes</button><button class="outline" onclick="page='dashboard';render()">🏠 Inicio</button></div>`}
function initAllMap(){
 if(!window.L)return;const el=$('allMap');if(!el)return;
 allMap=L.map('allMap').setView([19.4326,-99.1332],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(allMap);
 allMapMarkers=[];const located=clients.filter(c=>Number.isFinite(Number(c.latitud))&&Number.isFinite(Number(c.longitud)));
 if(!located.length)return;
 const bounds=[];located.forEach(c=>{const lat=Number(c.latitud),lng=Number(c.longitud);const m=L.marker([lat,lng]).addTo(allMap).bindPopup(`<b>${esc(c.nombre)}</b><br>Cuenta #${esc(c.numero_cuenta)}<br>${money(c.cantidad_pago)}<br><button onclick="openClient('${c.id}')">Abrir cliente</button>`);allMapMarkers.push(m);bounds.push([lat,lng]);});
 allMap.fitBounds(bounds,{padding:[25,25]});
}

function securityPage(){return `<button class="outline" onclick="page='dashboard';render()">← Inicio</button><h2>🔐 Seguridad</h2><div class="card"><b>Sesión</b><p>Usuario autenticado: <b>${esc(session?.user?.email||session?.user?.id||'—')}</b></p><span class="badge">Supabase Auth activo</span></div><div class="card"><b>Protección de datos</b><p>La aplicación envía <code>user_id</code> en clientes y pagos y además filtra las consultas por el usuario autenticado.</p><p><b>Importante:</b> la protección real contra acceso entre usuarios depende de las políticas <b>RLS</b> de Supabase. No las modifico automáticamente desde esta pantalla para evitar bloquear los datos existentes.</p><button class="outline" onclick="runSecurityCheck()">🔎 Comprobar conexión y RLS</button><div id="securityResult" class="mapnote" style="margin-top:10px"></div></div><div class="card"><b>Buenas prácticas</b><ul><li>No compartas tu contraseña.</li><li>La clave <i>publishable</i> puede estar en el frontend; RLS debe proteger las tablas.</li><li>Las fotos usan URLs firmadas de corta duración.</li></ul></div>`}
async function runSecurityCheck(){const e=$('securityResult');if(!e)return;e.textContent='Comprobando...';try{const a=await db.from('clientes').select('id').eq('user_id',session.user.id).limit(1);const b=await db.from('pagos').select('id').eq('user_id',session.user.id).limit(1);if(a.error||b.error)throw(a.error||b.error);e.innerHTML='✅ Conexión correcta. Las consultas de la aplicación están funcionando con el usuario autenticado. Para confirmar aislamiento entre usuarios hay que probar las políticas RLS desde Supabase con otra cuenta.';}catch(err){e.innerHTML='⚠️ '+esc(err.message||String(err));}}

async function savePayment(){
 const c=clients.find(x=>x.id===selected);
 const amount=Number($('pa').value), fecha=$('pd').value;
 const metodo=$('pm').value, notas=$('pn').value;
 if(!Number.isFinite(amount)||amount<=0)return message('Escribe un monto válido.');
 if(!fecha)return message('Selecciona la fecha del pago.');
 const r=await db.from('pagos').insert({
  user_id:session.user.id,cliente_id:c.id,cantidad:amount,
  fecha_pago:fecha,metodo_pago:metodo,notas:notas
 }).select().single();
 if(r.error)return message(r.error.message);
 await load(); page='detail'; render();
 if(confirm('Pago guardado correctamente. ¿Deseas imprimir el ticket ahora?')) printPaymentTicket(r.data);
}

function paymentNumber(p){
 const raw=String(p?.id||'').replace(/[^a-zA-Z0-9]/g,'').slice(-8).toUpperCase();
 return 'P-'+(raw||Date.now().toString().slice(-8));
}

function calendarPage(){
 const base=new Date(), y=base.getFullYear(), m=base.getMonth();
 const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
 const offset=(first.getDay()+6)%7; let cells='';
 for(let i=0;i<offset;i++)cells+='<div class="cal-empty"></div>';
 for(let d=1;d<=days;d++){
  const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const arr=clients.filter(c=>c.proximo_pago&&String(c.proximo_pago).slice(0,10)===ds);
  const cls=ds===localToday()?'cal-today':(ds<localToday()&&arr.length?'cal-overdue':(arr.length?'cal-due':''));
  cells+=`<div class="cal-day ${cls}" onclick="calendarDay('${ds}')"><b>${d}</b>${arr.length?`<small>👥 ${arr.length}</small><br><small>💵 ${money(arr.reduce((s,c)=>s+(Number(c.cantidad_pago)||0),0))}</small>`:''}</div>`;
 }
 return `<button class="outline" onclick="page='dashboard';render()">← Inicio</button><h2>📆 Calendario de cobranza</h2>
 <div class="card"><b>${base.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</b>
 <div class="calendar-grid"><div class="cal-head">L</div><div class="cal-head">M</div><div class="cal-head">X</div><div class="cal-head">J</div><div class="cal-head">V</div><div class="cal-head">S</div><div class="cal-head">D</div>${cells}</div></div>
 <div class="card"><small>🟢 Hoy · 🟠 Hay cobros · 🔴 Hay vencidos.</small></div>`;
}

function calendarDay(ds){
 const arr=clients.filter(c=>c.proximo_pago&&String(c.proximo_pago).slice(0,10)===ds);
 if(!arr.length)return message('No hay clientes con pago programado para '+date(ds)+'.');
 const names=arr.map(c=>`${c.nombre} — ${money(obligationInfo(c).balance)}`).join('\n');
 if(confirm(`Cobros del ${date(ds)}:\n\n${names}\n\n¿Abrir el primer cliente?`))openClient(arr[0].id);
}
