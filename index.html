<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#006b6b">
<link rel="manifest" href="manifest.json">
<title>AdminClientes V2</title>
<style>
:root{--p:#006b6b;--p2:#008f7a;--bg:#f4f7f7;--card:#fff;--txt:#173232;--muted:#6c7b7b;--danger:#e5484d;--ok:#22a06b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt)}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:600px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:76px}.top{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between}.top h1{font-size:20px;margin:0}.top button{background:transparent;color:#fff;font-size:22px}.top small{display:block;opacity:.8;font-size:10px}.main{padding:14px}.search{background:#fff;border-radius:14px;padding:12px;border:1px solid #dde7e7;width:100%;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;border-radius:12px;background:#fff;text-align:center;border:1px solid #e1e9e9}.stat b{font-size:20px;display:block}.stat small{color:var(--muted)}.btn{padding:12px 14px;border-radius:11px;font-weight:700}.primary{background:var(--p2);color:#fff}.outline{background:#fff;border:1px solid var(--p);color:var(--p)}.danger{background:#fff0f0;color:var(--danger);border:1px solid #ffd0d0}.card{background:var(--card);border-radius:15px;padding:14px;margin:10px 0;border:1px solid #e1e9e9;box-shadow:0 2px 8px #00000008}.row{display:flex;gap:12px;align-items:center}.grow{flex:1}.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#dce6e6;display:grid;place-items:center;font-size:22px}.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.paid{background:#dff7e9;color:#18784e}.pending{background:#ffe4e5;color:#b4232a}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.field{margin:10px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cfdcdc;border-radius:10px;background:#fff}.field textarea{min-height:80px}.photo{width:120px;height:120px;border-radius:16px;object-fit:cover;background:#dce6e6;display:block;margin:8px auto}.mapbox{background:#e8efef;border-radius:14px;padding:18px;text-align:center;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:30px 10px}.hidden{display:none!important}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);background:#fff;border-top:1px solid #dfe8e8;display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.nav button{padding:9px 2px;background:#fff;color:#647474;font-size:11px}.nav button b{display:block;font-size:20px}.nav .active{color:var(--p);font-weight:800}.back{font-size:14px;color:var(--p);background:none;padding:0;margin-bottom:8px}h2{font-size:18px;margin:10px 0}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(#005b61,#008b78)}.loginbox{background:#fff;border-radius:24px;padding:26px;width:min(430px,100%);text-align:center}.logo{font-size:44px}.loginbox h1{font-size:28px;margin:5px}.loginbox p{color:var(--muted)}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#173232;color:#fff;padding:10px 16px;border-radius:999px;z-index:30;display:none;max-width:90%;text-align:center}.loading{padding:40px;text-align:center;color:var(--muted)}.linkbtn{background:none;color:var(--p);text-decoration:underline;padding:8px}.small{font-size:12px;color:var(--muted)}.userbar{font-size:11px;opacity:.9;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.photo-loading{display:grid;place-items:center;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="root"><div class="loading">Cargando AdminClientes…</div></div><div id="toast" class="toast"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ===============================
// CONFIGURACIÓN SUPABASE
// ===============================
const SUPABASE_URL = 'https://dwijfgznbzhuhrdrwdri.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_aD4TGdGO5zxuPL8wld_PMQ_EWFuvA9Z';
const PHOTO_BUCKET = 'Fotos-clientes';
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, { auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true} });

let user=null, screen='home', editing=null, activeClient=null, clients=[], payments=[], newPhotoFile=null, photoUrlCache=new Map();
const root=()=>document.getElementById('root');
const gid=id=>document.getElementById(id);
const val=id=>gid(id)?.value||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n)||0);
const uid=()=>crypto.randomUUID();
function toast(t){const e=gid('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2500)}
function dateToday(){return new Date().toISOString().slice(0,10)}
function fmtErr(e){return e?.message||e?.error_description||'Ocurrió un error.'}

async function init(){
 const {data,error}=await supabase.auth.getSession();
 if(error){renderLogin();toast(fmtErr(error));return}
 user=data.session?.user||null;
 if(!user){renderLogin();return}
 await loadData();
 render();
 supabase.auth.onAuthStateChange(async (_event,session)=>{user=session?.user||null;if(user){await loadData();render()}else{clients=[];payments=[];renderLogin()}});
}

async function loadData(){
 const [cr,pr]=await Promise.all([
   supabase.from('clientes').select('*').order('created_at',{ascending:false}),
   supabase.from('pagos').select('*').order('fecha_pago',{ascending:false})
 ]);
 if(cr.error){toast('Error cargando clientes: '+fmtErr(cr.error));clients=[]}else clients=cr.data||[];
 if(pr.error){toast('Error cargando pagos: '+fmtErr(pr.error));payments=[]}else payments=pr.data||[];
}

function renderLogin(){root().innerHTML=`<div class="login"><div class="loginbox"><div class="logo">👥</div><h1>AdminClientes V2</h1><p>Clientes, pagos y fotografías sincronizados en la nube.</p><form onsubmit="event.preventDefault();login()"><div class="field" style="text-align:left"><label>Correo electrónico</label><input id="email" type="email" autocomplete="email" required></div><div class="field" style="text-align:left"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%;margin-top:8px">🔐 Iniciar sesión</button></form><button class="linkbtn" onclick="signup()">Crear una cuenta</button><p class="small">La sesión se guarda de forma segura en este dispositivo.</p></div></div>`}

window.login=async()=>{const email=val('email').trim(),password=val('password');if(!email||!password)return;toast('Iniciando sesión…');const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){toast(fmtErr(error));return}user=data.user;await loadData();screen='home';render();toast('Sesión iniciada')};
window.signup=async()=>{const email=prompt('Escribe el correo para la nueva cuenta:');if(!email)return;const password=prompt('Escribe una contraseña de al menos 6 caracteres:');if(!password)return;const {error}=await supabase.auth.signUp({email:email.trim(),password});if(error)toast(fmtErr(error));else toast('Cuenta creada. Revisa tu correo si Supabase solicita confirmación.')};
window.logout=async()=>{await supabase.auth.signOut();user=null;renderLogin();toast('Sesión cerrada')};

function nav(){return `<div class="nav">${[['home','⌂','Inicio'],['clients','👥','Clientes'],['map','📍','Mapa'],['reports','▣','Pagos'],['settings','⚙','Más']].map(x=>`<button class="${screen===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</div>`}
window.go=s=>{screen=s;editing=null;newPhotoFile=null;render();scrollTo(0,0)};
function shell(content){return `<div class="app"><div class="top"><div><h1>AdminClientes V2</h1><small class="userbar">${esc(user?.email||'')}</small></div><button onclick="go('settings')">⚙</button></div><main class="main">${content}</main>${nav()}</div>`}

function render(){if(!user)return renderLogin();let c=screen==='home'?home():screen==='clients'?clientsPage():screen==='new'?form():screen==='detail'?detail():screen==='pay'?payForm():screen==='history'?history():screen==='map'?mapPage():screen==='reports'?reports():settings();root().innerHTML=shell(c);hydratePhotos();}

function home(){const pending=clients.filter(c=>isPending(c)).length;const today=payments.filter(p=>String(p.fecha_pago).slice(0,10)===dateToday()).reduce((a,p)=>a+Number(p.cantidad||0),0);return `<input class="search" placeholder="🔎 Buscar por nombre o número de cuenta..." oninput="filterClients(this.value)"><div class="grid"><div class="stat"><b>${clients.length}</b><small>Total clientes</small></div><div class="stat"><b>${pending}</b><small>Pendientes</small></div><div class="stat"><b>${money(today)}</b><small>Pagos hoy</small></div></div><button class="btn primary" style="width:100%;margin:12px 0" onclick="go('new')">＋ Nuevo cliente</button><h2>Clientes recientes</h2><div id="clientList">${clientCards(clients.slice(0,8))}</div>`}
function filterMarkup(arr){return clientCards(arr)}
window.filterClients=q=>{const e=gid('clientList');if(e)e.innerHTML=filterMarkup(clients.filter(c=>(c.nombre+' '+c.numero_cuenta+' '+(c.telefono||'')).toLowerCase().includes(q.toLowerCase())));hydratePhotos()};
function clientsPage(){return `<h2>Clientes</h2><input class="search" placeholder="🔎 Buscar cliente..." oninput="filterPage(this.value)"><div id="allClients">${clientCards(clients)}</div><button class="btn primary" style="width:100%" onclick="go('new')">＋ Nuevo cliente</button>`}
window.filterPage=q=>{const e=gid('allClients');if(e)e.innerHTML=clientCards(clients.filter(c=>(c.nombre+' '+c.numero_cuenta+' '+(c.telefono||'')).toLowerCase().includes(q.toLowerCase())));hydratePhotos()};
function isPending(c){if(!c) return false; const next=c.proximo_pago;if(!next)return false;return next<dateToday()}
function clientCards(arr){if(!arr.length)return '<div class="empty">No hay clientes registrados.</div>';return arr.map(c=>`<div class="card" onclick="activeClient='${c.id}';screen='detail';render()"><div class="row">${photo(c)}<div class="grow"><b>${esc(c.nombre)}</b><div style="font-size:13px;color:var(--muted)">Cuenta #${esc(c.numero_cuenta)}</div><div style="font-size:13px">${money(c.cantidad_pago)} · Próx. ${c.proximo_pago||'—'}</div></div><span class="badge ${isPending(c)?'pending':'paid'}">${isPending(c)?'Pendiente':'Activo'}</span></div></div>`).join('')}
function photo(c){if(!c.foto_url)return '<div class="avatar">👤</div>';return `<div class="avatar photo-loading" data-photo="${esc(c.foto_url)}">📷</div>`}
async function hydratePhotos(){const els=[...document.querySelectorAll('[data-photo]')];for(const e of els){const path=e.dataset.photo;if(photoUrlCache.has(path)){e.outerHTML=`<img class="avatar" src="${photoUrlCache.get(path)}" alt="Foto">`;continue}const {data,error}=await supabase.storage.from(PHOTO_BUCKET).createSignedUrl(path,3600);if(!error&&data?.signedUrl){photoUrlCache.set(path,data.signedUrl);e.outerHTML=`<img class="avatar" src="${data.signedUrl}" alt="Foto">`}}}
function current(){return clients.find(c=>c.id===activeClient)}

function form(){const c=editing?current():{};return `<button class="back" onclick="go('clients')">← Regresar</button><h2>${editing?'Editar cliente':'Nuevo cliente'}</h2><form onsubmit="event.preventDefault();saveClient()"><div class="field"><label>Número de cuenta *</label><input id="account" required value="${esc(c.numero_cuenta||'')}"></div><div class="field"><label>Nombre completo *</label><input id="name" required value="${esc(c.nombre||'')}"></div><div class="field"><label>Número de contacto</label><input id="phone" type="tel" value="${esc(c.telefono||'')}"></div><div class="field"><label>Cantidad de pago *</label><input id="amount" type="number" min="0" step="0.01" required value="${c.cantidad_pago??''}"></div><div class="field"><label>Frecuencia de pago</label><select id="freq"><option value="Semanal" ${c.frecuencia_pago==='Semanal'?'selected':''}>Semanal</option><option value="Quincenal" ${c.frecuencia_pago==='Quincenal'?'selected':''}>Quincenal</option><option value="Mensual" ${!c.frecuencia_pago||c.frecuencia_pago==='Mensual'?'selected':''}>Mensual</option></select></div><div class="field"><label>Fecha de próximo pago</label><input id="next" type="date" value="${c.proximo_pago||''}"></div><div class="field"><label>Ubicación</label><div class="actions"><button type="button" class="btn primary" onclick="gps()">📍 Obtener GPS</button><button type="button" class="btn outline" onclick="openMap()">🗺️ Ver mapa</button></div><input id="lat" type="hidden" value="${c.latitud??''}"><input id="lng" type="hidden" value="${c.longitud??''}"><small id="loc" style="color:var(--muted)">${c.latitud?'Ubicación guardada ✓':'Sin ubicación'}</small></div><div class="field"><label>Foto</label><div class="actions"><button type="button" class="btn primary" onclick="gid('cameraFile').click()">📷 Tomar foto</button><button type="button" class="btn outline" onclick="gid('galleryFile').click()">🖼️ Galería / Mis archivos</button></div><input id="cameraFile" type="file" accept="image/*" capture="environment" style="display:none" onchange="previewPhoto(this)"><input id="galleryFile" type="file" accept="image/*" style="display:none" onchange="previewPhoto(this)"><div id="previewWrap">${c.foto_url?`<div class="small">Foto actual</div><div class="photo photo-loading" data-photo="${esc(c.foto_url)}">📷</div>`:''}</div></div><div class="field"><label>Notas</label><textarea id="notes">${esc(c.notas||'')}</textarea></div><button class="btn primary" style="width:100%" type="submit">Guardar cliente</button></form>`}
window.previewPhoto=inp=>{const f=inp.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Selecciona una imagen');return}newPhotoFile=f;const url=URL.createObjectURL(f);gid('previewWrap').innerHTML=`<div class="small">Nueva foto seleccionada</div><img id="preview" class="photo" src="${url}" alt="Vista previa">`};
window.gps=()=>{if(!navigator.geolocation)return toast('GPS no disponible');toast('Obteniendo ubicación…');navigator.geolocation.getCurrentPosition(p=>{gid('lat').value=p.coords.latitude;gid('lng').value=p.coords.longitude;gid('loc').textContent='Ubicación GPS guardada ✓';toast('Ubicación obtenida')},e=>toast('No se pudo obtener el GPS: '+(e.message||'')),{enableHighAccuracy:true,timeout:15000,maximumAge:0})};
async function uploadPhoto(file,clientId){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=`${user.id}/${clientId}/${Date.now()}.${ext}`;const {error}=await supabase.storage.from(PHOTO_BUCKET).upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});if(error)throw error;return path}
window.saveClient=async()=>{const account=val('account').trim(),name=val('name').trim(),amount=Number(val('amount'));if(!account||!name||!Number.isFinite(amount)){toast('Completa cuenta, nombre y cantidad');return}toast('Guardando cliente…');const id=editing||uid();let photoPath=editing?current()?.foto_url||null:null;if(newPhotoFile){try{photoPath=await uploadPhoto(newPhotoFile,id)}catch(e){toast('No se pudo subir la foto: '+fmtErr(e));return}}const payload={user_id:user.id,numero_cuenta:account,nombre:name,telefono:val('phone').trim()||null,cantidad_pago:amount,frecuencia_pago:val('freq')||null,proximo_pago:val('next')||null,latitud:val('lat')?Number(val('lat')):null,longitud:val('lng')?Number(val('lng')):null,foto_url:photoPath,notas:val('notes').trim()||null};let res;if(editing)res=await supabase.from('clientes').update(payload).eq('id',id).eq('user_id',user.id).select().single();else res=await supabase.from('clientes').insert(payload).select().single();if(res.error){toast('No se pudo guardar: '+fmtErr(res.error));return}await loadData();activeClient=id;editing=null;newPhotoFile=null;screen='detail';render();toast('Cliente guardado en la nube ✓')};

function detail(){const c=current();if(!c)return clientsPage();return `<button class="back" onclick="go('clients')">← Clientes</button><div class="card"><div class="row">${photo(c)}<div class="grow"><span class="badge paid">Cuenta #${esc(c.numero_cuenta)}</span><h2 style="margin:5px 0">${esc(c.nombre)}</h2><span class="badge ${isPending(c)?'pending':'paid'}">${isPending(c)?'Pendiente':'Activo'}</span></div></div><p>📞 ${esc(c.telefono||'Sin teléfono')}</p><p>💰 Pago: <b>${money(c.cantidad_pago)}</b></p><p>🔁 Frecuencia: ${esc(c.frecuencia_pago||'—')}</p><p>📅 Próximo pago: ${c.proximo_pago||'—'}</p><div class="mapbox">📍 ${c.latitud?'Ubicación GPS guardada':'No hay ubicación guardada'}<br><button class="btn outline" style="margin-top:10px" onclick="openMap()">Ver en mapa / Cómo llegar</button></div>${c.foto_url?`<div data-photo="${esc(c.foto_url)}" class="photo photo-loading">📷</div>`:''}<p>${esc(c.notas||'')}</p><div class="actions"><button class="btn outline" onclick="editing='${c.id}';screen='new';render()">✏️ Editar</button><button class="btn primary" onclick="screen='pay';render()">💵 Registrar pago</button><button class="btn outline" onclick="screen='history';render()">📋 Historial</button><button class="btn outline" onclick="openMap()">📍 Cómo llegar</button></div></div><button class="btn danger" style="width:100%" onclick="deleteClient('${c.id}')">Eliminar cliente</button>`}
window.deleteClient=async id=>{if(!confirm('¿Eliminar este cliente y sus pagos?'))return;const c=clients.find(x=>x.id===id);const {error}=await supabase.from('clientes').delete().eq('id',id).eq('user_id',user.id);if(error){toast('No se pudo eliminar: '+fmtErr(error));return}if(c?.foto_url){await supabase.storage.from(PHOTO_BUCKET).remove([c.foto_url]).catch(()=>{})}await loadData();activeClient=null;go('clients');toast('Cliente eliminado')};

function payForm(){const c=current();return `<button class="back" onclick="go('detail')">← Regresar</button><h2>Registrar pago</h2><div class="card"><div class="row">${photo(c)}<div><b>${esc(c.nombre)}</b><div>Cuenta #${esc(c.numero_cuenta)}</div></div></div></div><div class="field"><label>Fecha de pago</label><input id="payDate" type="date" value="${dateToday()}"></div><div class="field"><label>Monto</label><input id="payAmount" type="number" min="0" step="0.01" value="${c.cantidad_pago}"></div><div class="field"><label>Método de pago</label><select id="method"><option>Efectivo</option><option>Transferencia</option><option>Depósito</option><option>Otro</option></select></div><div class="field"><label>Notas</label><textarea id="payNotes"></textarea></div><button class="btn primary" style="width:100%" onclick="savePayment()">Guardar pago</button>`}
window.savePayment=async()=>{const c=current(),amount=Number(val('payAmount'));if(!c||!Number.isFinite(amount)||amount<0){toast('Monto inválido');return}toast('Guardando pago…');const {data,error}=await supabase.from('pagos').insert({user_id:user.id,cliente_id:c.id,cantidad:amount,fecha_pago:val('payDate')||dateToday(),metodo_pago:val('method')||null,notas:val('payNotes').trim()||null}).select().single();if(error){toast('No se pudo guardar: '+fmtErr(error));return}await loadData();screen='history';render();toast('Pago guardado en la nube ✓')};
function history(){const c=current(),ps=payments.filter(p=>p.cliente_id===c.id);return `<button class="back" onclick="go('detail')">← Regresar</button><h2>Historial de pagos</h2><div class="card"><b>${esc(c.nombre)}</b><div>Cuenta #${esc(c.numero_cuenta)}</div><div class="grid" style="margin-top:12px"><div class="stat"><b>${money(ps.reduce((a,p)=>a+Number(p.cantidad||0),0))}</b><small>Pagado</small></div><div class="stat"><b>${ps.length}</b><small>Pagos</small></div></div></div>${ps.length?ps.map(p=>`<div class="card"><div class="row"><div class="grow"><b>${String(p.fecha_pago).slice(0,10)}</b><div style="color:var(--muted)">${esc(p.metodo_pago||'—')}</div></div><b>${money(p.cantidad)}</b></div>${p.notas?`<div class="small" style="margin-top:7px">${esc(p.notas)}</div>`:''}</div>`).join(''):'<div class="empty">No hay pagos registrados.</div>'}`}
function mapPage(){const pts=clients.filter(c=>c.latitud&&c.longitud);return `<h2>Mapa de clientes</h2><div class="mapbox" style="min-height:220px">🗺️<h3>Ubicaciones guardadas</h3><p>${pts.length} cliente(s) con GPS</p>${pts.length?pts.map(c=>`<button class="btn outline" style="margin:4px" onclick="activeClient='${c.id}';openMap()">${esc(c.nombre)}</button>`).join(''):'<p>Agrega GPS desde el expediente de un cliente.</p>'}</div>`}
window.openMap=()=>{const c=current();if(c?.latitud&&c?.longitud)window.open(`https://www.google.com/maps/dir/?api=1&destination=${c.latitud},${c.longitud}`,'_blank');else toast('Este cliente no tiene ubicación GPS')};
function reports(){const total=payments.reduce((a,p)=>a+Number(p.cantidad||0),0),pending=clients.filter(isPending).length;return `<h2>Reportes</h2><div class="card"><b>Resumen</b><p>Clientes registrados: <b>${clients.length}</b></p><p>Pagos pendientes: <b>${pending}</b></p><p>Total cobrado: <b>${money(total)}</b></p><button class="btn primary" onclick="exportCSV()">⬇️ Exportar clientes a CSV</button></div><div class="card"><b>Pagos registrados</b><p>${payments.length} pagos · ${money(total)}</p></div>`}
function settings(){return `<h2>Configuración</h2><div class="card"><b>Cuenta</b><p class="small">${esc(user?.email||'')}</p><button class="btn outline" style="width:100%" onclick="logout()">🚪 Cerrar sesión</button></div><div class="card"><b>Sincronización</b><p>Los clientes y pagos se almacenan en Supabase. Las fotografías se guardan en el bucket privado <b>Fotos-clientes</b>.</p><button class="btn outline" style="width:100%" onclick="refreshData()">🔄 Sincronizar ahora</button></div><div class="card"><b>AdminClientes V2</b><p class="small">Con inicio de sesión, base de datos, fotografías privadas y sincronización en la nube.</p></div>`}
window.refreshData=async()=>{toast('Sincronizando…');await loadData();render();toast('Datos sincronizados ✓')};
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
window.exportCSV=()=>{let rows=[['Cuenta','Nombre','Teléfono','Pago','Frecuencia','Próximo pago','Latitud','Longitud','Notas']];clients.forEach(c=>rows.push([c.numero_cuenta,c.nombre,c.telefono,c.cantidad_pago,c.frecuencia_pago,c.proximo_pago,c.latitud,c.longitud,c.notas]));download('clientes.csv','\\ufeff'+rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\\n'),'text/csv;charset=utf-8');toast('CSV exportado')};

if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
init();
</script>
</body>
