<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#006b6b">
<title>AdminClientes V2</title>
<style>
body{margin:0;font-family:system-ui;background:#f4f7f7;color:#173232}
.app{max-width:620px;margin:auto;padding-bottom:70px}
header{background:#006b6b;color:white;padding:16px;font-size:21px;font-weight:800}
main{padding:14px}
.card{background:white;border:1px solid #dfe8e8;border-radius:15px;padding:14px;margin:10px 0}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 12px;border:1px solid #cbd8d8;border-radius:10px}
button{padding:11px 14px;border-radius:10px;border:0;font-weight:700}
.primary{background:#008f7a;color:white}
.outline{background:white;color:#006b6b;border:1px solid #006b6b}
.danger{background:#ffe9e9;color:#b4232a}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1}
.avatar{width:55px;height:55px;border-radius:50%;object-fit:cover;background:#dce6e6;display:grid;place-items:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px}
.nav button{background:white;color:#006b6b}
.login{min-height:100vh;display:grid;place-items:center;background:#006b6b}
.login .card{width:min(400px,85%);text-align:center}
.filebtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:48px}
.filebtn input{position:absolute;inset:0;opacity:.01;margin:0;cursor:pointer}
.photo{max-width:150px;max-height:150px;border-radius:14px;display:block;margin:8px auto}
small{color:#687777}
.error{background:#ffe9e9;color:#9b1c1c;padding:10px;border-radius:10px;margin:10px 0}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://dwijfgznbzhuhrdrwdri.supabase.co';
const KEY='sb_publishable_aD4TGdGO5zxuPL8wld_PMQ_EWFuvA9Z';
const db=window.supabase.createClient(SUPABASE_URL,KEY);
const BUCKET='Fotos-clientes';

let session=null,clients=[],payments=[],page='login',selected=null,photoFile=null,bootError='';

document.addEventListener('DOMContentLoaded',()=>{
  render();
  start().catch(e=>{
    bootError=e?.message||String(e);
    page='error';
    render();
  });
});

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const money=n=>new Intl.NumberFormat('es-MX',{
  style:'currency',
  currency:'MXN'
}).format(Number(n)||0);

const date=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'—';
const $=id=>document.getElementById(id);

function message(t){alert(t)}

async function load(){
  if(!session)return;

  const a=await db.from('clientes')
    .select('*')
    .eq('user_id',session.user.id)
    .order('created_at',{ascending:false});

  const b=await db.from('pagos')
    .select('*')
    .eq('user_id',session.user.id)
    .order('fecha_pago',{ascending:false});

  if(a.error)throw a.error;
  if(b.error)throw b.error;

  clients=a.data||[];
  payments=b.data||[];
}

async function signed(path){
  if(!path)return'';
  const r=await db.storage.from(BUCKET).createSignedUrl(path,3600);
  return r.data?.signedUrl||'';
}

async function start(){
  if(!window.supabase){
    throw new Error('No se pudo cargar la librería de Supabase. Comprueba tu conexión a Internet y vuelve a cargar la página.');
  }

  const r=await db.auth.getSession();
  if(r.error)throw r.error;

  session=r.data.session;

  if(session){
    try{
      await load();
      page='clients';
      render();
    }catch(e){
      bootError=e?.message||String(e);
      page='error';
      render();
    }
  }

  db.auth.onAuthStateChange(async (_e,s)=>{
    session=s;

    if(!s){
      page='login';
      render();
    }else{
      try{
        await load();
        page='clients';
        render();
      }catch(e){
        bootError=e?.message||String(e);
        page='error';
        render();
      }
    }
  });
}

function render(){
  if(page==='login'){
    $('root').innerHTML=`
      <div class="login">
        <div class="card">
          <h1>👥 AdminClientes</h1>
          <p>Inicia sesión para sincronizar tus clientes.</p>
          <label>Correo</label>
          <input id="email" type="email">
          <label>Contraseña</label>
          <input id="pass" type="password">
          <button class="primary" style="width:100%" onclick="login()">Iniciar sesión</button>
        </div>
      </div>`;
    return;
  }

  if(page==='error'){
    $('root').innerHTML=`
      <div class="app">
        <header>AdminClientes</header>
        <main>
          <div class="error">
            <b>Error al cargar:</b><br>${esc(bootError||'Error desconocido')}
          </div>
          <button class="outline" onclick="location.reload()">Reintentar</button>
        </main>
      </div>`;
    return;
  }

  let body=page==='clients'?list():
           page==='form'?form():
           page==='detail'?detail():
           page==='payments'?payForm():history();

  $('root').innerHTML=`
    <div class="app">
      <header>AdminClientes</header>
      <main>${body}</main>
      <div class="nav">
        <button onclick="page='clients';render()">👥 Clientes</button>
        <button onclick="newClient()">＋ Nuevo</button>
        <button onclick="logout()">↪ Salir</button>
      </div>
    </div>`;

  if(page==='clients')loadPhotos();
  if(page==='detail')loadDetailPhoto();
}

async function login(){
  const r=await db.auth.signInWithPassword({
    email:$('email').value.trim(),
    password:$('pass').value
  });

  if(r.error)return message(r.error.message);

  session=r.data.session;
  await load();
  page='clients';
  render();
}

async function logout(){
  await db.auth.signOut();
  session=null;
  page='login';
  render();
}

function newClient(){
  selected=null;
  photoFile=null;
  page='form';
  render();
}

function list(){
  if(!clients.length){
    return `
      <h2>Clientes</h2>
      <div class="card" style="text-align:center">No hay clientes registrados.</div>
      <button class="primary" onclick="newClient()">＋ Agregar cliente</button>`;
  }

  return `
    <h2>Clientes</h2>
    <input placeholder="🔎 Buscar..." oninput="filter(this.value)">
    <div id="list">${cards(clients)}</div>`;
}

function cards(arr){
  return arr.map(c=>`
    <div class="card" onclick="openClient('${c.id}')">
      <div class="row">
        <div id="p-${c.id}" class="avatar">👤</div>
        <div class="grow">
          <b>${esc(c.nombre)}</b><br>
          <small>Cuenta #${esc(c.numero_cuenta)}</small><br>
          ${money(c.cantidad_pago)} · Próx. ${date(c.proximo_pago)}
        </div>
      </div>
    </div>`).join('');
}

async function filter(q){
  $('list').innerHTML=cards(
    clients.filter(c=>
      (c.nombre+' '+c.numero_cuenta+' '+(c.telefono||''))
      .toLowerCase()
      .includes(q.toLowerCase())
    )
  );
  loadPhotos();
}

async function loadPhotos(){
  for(const c of clients){
    if(!c.foto_url)continue;
    const u=await signed(c.foto_url);
    const e=$('p-'+c.id);
    if(e&&u)e.innerHTML=`<img class="avatar" src="${u}">`;
  }
}

function openClient(id){
  selected=id;
  page='detail';
  render();
}

async function loadDetailPhoto(){
  const c=clients.find(x=>x.id===selected);
  if(!c?.foto_url)return;

  const u=await signed(c.foto_url);
  const e=$('detailPhoto');

  if(e&&u)e.src=u;
}

function form(){
  const c=clients.find(x=>x.id===selected)||{};

  return `
    <button class="outline" onclick="page='clients';render()">← Clientes</button>
    <h2>${selected?'Editar':'Nuevo'} cliente</h2>

    <label>Número de cuenta *</label>
    <input id="account" value="${esc(c.numero_cuenta)}">

    <label>Nombre *</label>
    <input id="name" value="${esc(c.nombre)}">

    <label>Contacto</label>
    <input id="phone" type="tel" value="${esc(c.telefono)}">

    <label>Cantidad de pago *</label>
    <input id="amount" type="number" step="0.01" value="${c.cantidad_pago??''}">

    <label>Frecuencia</label>
    <select id="freq">
      <option ${c.frecuencia_pago==='Semanal'?'selected':''}>Semanal</option>
      <option ${c.frecuencia_pago==='Quincenal'?'selected':''}>Quincenal</option>
      <option ${!c.frecuencia_pago||c.frecuencia_pago==='Mensual'?'selected':''}>Mensual</option>
    </select>

    <label>Próximo pago</label>
    <input id="next" type="date" value="${String(c.proximo_pago||'').slice(0,10)}">

    <div class="card">
      <b>Fotografía</b>
      <div class="actions">
        <label class="primary filebtn">
          📷 Tomar foto
          <input id="cam" type="file" accept="image/*" capture="environment" onchange="pickPhoto(this)">
        </label>
        <label class="outline filebtn">
          🖼️ Galería
          <input id="gal" type="file" accept="image/*" onchange="pickPhoto(this)">
        </label>
      </div>
      <div id="preview"></div>
    </div>

    <label>Notas</label>
    <textarea id="notes">${esc(c.notas)}</textarea>

    <div class="actions">
      <button class="primary" onclick="saveClient()">💾 Guardar</button>
      <button class="outline" onclick="page='clients';render()">Cancelar</button>
    </div>`;
}

function pickPhoto(i){
  photoFile=i.files?.[0]||null;

  if(photoFile){
    const u=window.URL.createObjectURL(photoFile);
    $('preview').innerHTML=`<img class="photo" src="${u}">`;
  }
}

async function saveClient(){
  const p={
    user_id:session.user.id,
    numero_cuenta:$('account').value.trim(),
    nombre:$('name').value.trim(),
    telefono:$('phone').value.trim(),
    cantidad_pago:Number($('amount').value),
    frecuencia_pago:$('freq').value,
    proximo_pago:$('next').value||null,
    notas:$('notes').value
  };

  if(!p.numero_cuenta||!p.nombre||!Number.isFinite(p.cantidad_pago)){
    return message('Completa cuenta, nombre y cantidad.');
  }

  let r=selected
    ?await db.from('clientes')
      .update(p)
      .eq('id',selected)
      .eq('user_id',session.user.id)
      .select()
      .single()
    :await db.from('clientes')
      .insert(p)
      .select()
      .single();

  if(r.error)return message(r.error.message);

  const id=r.data.id;

  if(photoFile){
    const ext=(photoFile.name.split('.').pop()||'jpg')
      .replace(/[^a-z0-9]/gi,'')||'jpg';

    const path=`${session.user.id}/${id}/${crypto.randomUUID()}.${ext}`;

    const u=await db.storage
      .from(BUCKET)
      .upload(path,photoFile,{
        contentType:photoFile.type||'image/jpeg'
      });

    if(u.error)return message('Cliente guardado, pero foto: '+u.error.message);

    const x=await db.from('clientes')
      .update({foto_url:path})
      .eq('id',id)
      .eq('user_id',session.user.id);

    if(x.error)return message(x.error.message);
  }

  await load();
  selected=id;
  photoFile=null;
  page='detail';
  render();
  message('Cliente guardado correctamente en Supabase.');
}

function detail(){
  const c=clients.find(x=>x.id===selected);

  if(!c)return `<p>Cliente no encontrado.</p>`;

  return `
    <button class="outline" onclick="page='clients';render()">← Clientes</button>
    <div class="card">
      <h2>${esc(c.nombre)}</h2>
      <p><b>Cuenta:</b> ${esc(c.numero_cuenta)}</p>
      <p>📞 ${esc(c.telefono||'—')}</p>
      <p>💰 ${money(c.cantidad_pago)} · ${esc(c.frecuencia_pago||'')}</p>
      <p>📅 Próximo pago: <b>${date(c.proximo_pago)}</b></p>
      <p>📍 ${c.latitud?'Ubicación guardada':'Sin ubicación'}</p>
      ${c.foto_url?'<img id="detailPhoto" class="photo">':''}
      <p>${esc(c.notas||'')}</p>
      <div class="actions">
        <button class="outline" onclick="page='form';render()">✏️ Editar</button>
        <button class="primary" onclick="page='payments';render()">💵 Registrar pago</button>
      </div>
    </div>`;
}

function payForm(){
  const c=clients.find(x=>x.id===selected);

  return `
    <button class="outline" onclick="page='detail';render()">← Regresar</button>
    <h2>Registrar pago</h2>
    <div class="card">
      <b>${esc(c.nombre)}</b><br>
      Cuenta #${esc(c.numero_cuenta)}
    </div>

    <label>Fecha</label>
    <input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}">

    <label>Monto</label>
    <input id="pa" type="number" step="0.01" value="${c.cantidad_pago}">

    <label>Método</label>
    <select id="pm">
      <option>Efectivo</option>
      <option>Transferencia</option>
      <option>Depósito</option>
      <option>Otro</option>
    </select>

    <label>Notas</label>
    <textarea id="pn"></textarea>

    <button class="primary" style="width:100%" onclick="savePayment()">Guardar pago</button>`;
}

async function savePayment(){
  const c=clients.find(x=>x.id===selected);

  const r=await db.from('pagos').insert({
    user_id:session.user.id,
    cliente_id:c.id,
    cantidad:Number($('pa').value),
    fecha_pago:$('pd').value,
    metodo_pago:$('pm').value,
    notas:$('pn').value
  });

  if(r.error)return message(r.error.message);

  await load();
  page='detail';
  render();
  message('Pago guardado.');
}

function history(){
  const c=clients.find(x=>x.id===selected);
  const ps=payments.filter(p=>p.cliente_id===c.id);

  return `
    <button class="outline" onclick="page='detail';render()">← Regresar</button>
    <h2>Historial</h2>
    ${ps.length
      ?ps.map(p=>`
        <div class="card">
          ${date(p.fecha_pago)} — <b>${money(p.cantidad)}</b><br>
          <small>${esc(p.metodo_pago||'')}</small>
        </div>`).join('')
      :'<div class="card">No hay pagos.</div>'}`;
}
</script>
</body>
</html>
